<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinGuard | Sign in</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page"><form id="loginForm" class="login-card"><span class="brand">FinGuard</span><h1>Welcome back</h1>
<p>Sign in to review synthetic transaction alerts.</p><label>Username<input id="username" required autocomplete="username"></label>
<label>Password<input id="password" type="password" required autocomplete="current-password"></label>
<button type="submit">Sign in</button><p id="loginMessage" role="status"></p>
<p class="hint">First time? <button type="button" class="link-btn" id="registerBtn">Create demo account</button></p></form><script src="login.js"></script></body></html>
